<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZVAULT — collection</title>
  <link rel="stylesheet" href="./css/mint.css" />
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .card {
      border: 1px solid var(--line);
      background: #0e1218;
      padding: 0.75rem;
    }
    .card img {
      width: 100%;
      image-rendering: pixelated;
      background: #000;
      display: block;
    }
    .card h3 { margin: 0.5rem 0 0.25rem; font-size: 0.9rem; color: var(--accent); }
    .card .traits { color: var(--dim); font-size: 0.7rem; line-height: 1.35; }
    .card code {
      display: block; margin-top: 0.5rem; font-size: 0.65rem;
      color: var(--warn); word-break: break-all; white-space: pre-wrap;
    }
  </style>
</head>
<body>
<main>
  <h1>ZVAULT // COLLECTION</h1>
  <p class="banner">
    Revealed punks only. Art is derived in Python from
    <code>derive_tier(trait_hash, tier)</code> — anyone can re-run the verify
    command under each card. Sealed boxes do not appear here.
  </p>
  <p class="kv"><span>revealed</span> <b id="count">—</b> ·
     <span>digest</span> <b id="digest">—</b></p>
  <p id="err" class="fail"></p>
  <div class="gallery" id="gallery"></div>
  <footer>
    <a href="./">mine</a> · protocol art stays in Python · no JS port of draw
  </footer>
</main>
<script type="module">
  const gallery = document.getElementById("gallery");
  const err = document.getElementById("err");
  try {
    const r = await fetch("./pub/collection.json");
    if (!r.ok) throw new Error(`collection.json ${r.status} — publisher running?`);
    const doc = await r.json();
    document.getElementById("count").textContent =
      `${doc.revealed ?? 0} / ${doc.minted ?? "—"}`;
    document.getElementById("digest").textContent =
      doc.digest ? doc.digest.slice(0, 16) + "…" : "—";
    if (!doc.punks?.length) {
      gallery.innerHTML = "<p class='banner'>No reveals yet.</p>";
    } else {
      for (const p of doc.punks) {
        const el = document.createElement("article");
        el.className = "card";
        const t = p.traits_summary || {};
        const traitsLine = Object.entries(t).map(([k, v]) => `${k}:${v}`).join(" · ");
        el.innerHTML = `
          <img src="./pub/${p.png}" alt="punk #${p.index}" width="384" height="384" />
          <h3>#${p.index} · ${p.tier_name}</h3>
          <div class="traits">score ${p.score?.toLocaleString?.() ?? p.score}<br/>${traitsLine}</div>
          <code>${p.verify || ""}</code>`;
        gallery.appendChild(el);
      }
    }
  } catch (e) {
    err.textContent = String(e.message || e);
  }
</script>
</body>
</html>
